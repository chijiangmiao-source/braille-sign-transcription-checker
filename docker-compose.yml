name: braille-qc

services:
  api:
    build:
      context: ./api
      target: runtime
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: ./web
      target: runtime
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    build:
      context: ./api
      target: test
    profiles: ["verify"]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web:80

  web-test:
    build:
      context: ./web
      target: test
    profiles: ["test"]
